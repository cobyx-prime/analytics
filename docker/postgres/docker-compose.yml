services:
  postgres:
    image: postgres:16
    container_name: analytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-almat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-almat}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    name: analytics-pgdata
